name: CacheFlow
options:
  bundleIdPrefix: com.cacheflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  CacheFlowKit:
    path: Packages/CacheFlowKit
targets:
  CacheFlow:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CacheFlowKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Socrates
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPad only, landscape only, never resized: the arm is calibrated to
        # canvas points, so the board must not rotate or scale.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        # The Spark is reached over the LAN or Tailscale on plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Socrates listens when you hold the talk button to answer a question.
        NSLocalNetworkUsageDescription: Socrates talks to the tutor server on your local network.
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  CacheFlow:
    build:
      targets:
        CacheFlow: all
    run:
      config: Debug
