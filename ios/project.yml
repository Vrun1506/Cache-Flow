name: CacheFlow
options:
  bundleIdPrefix: com.cacheflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  CacheFlowKit:
    path: Packages/CacheFlowKit
targets:
  CacheFlow:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CacheFlowKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Socrates
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPad only, landscape only, never resized: board-space coordinates
        # are shared by student ink, uploads and tutor annotations.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        # The Spark session API is local HTTPS/WSS (see Interface.md); local
        # networking stays allowed for development servers.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Socrates listens when you hold the talk button to answer a question.
        NSLocalNetworkUsageDescription: Socrates talks to the tutor server on your local network.
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  CacheFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CacheFlow
    settings:
      base:
        # XCTest UI APIs are main-actor isolated; Swift 5 mode keeps the
        # test target free of strict-concurrency friction.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CacheFlow
        CODE_SIGN_STYLE: Automatic
schemes:
  CacheFlow:
    build:
      targets:
        CacheFlow: all
        CacheFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: CacheFlowUITests
